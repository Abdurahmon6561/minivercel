# Render blueprint. `New > Blueprint` in the dashboard, point it at this repo.
#
# One free web service and nothing else: the free tier grants 750 instance hours
# per month across the whole workspace, always-on burns ~720, and a second free
# service would push the workspace over and suspend both (SPEC.md).
services:
  - type: web
    name: minivercel
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    # app/hostrouting.py answers this path regardless of the Host header
    # Render's checker sends, so it keeps working across the URL_MODE=path ->
    # subdomain cutover without a separate health-check domain.
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false          # service_role. Set it in the dashboard, never here.
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_BUCKET
        value: sites
      - key: PUBLIC_BASE_URL
        sync: false          # https://<your-service>.onrender.com, or https://api.getdropbin.xyz
      - key: URL_MODE
        value: path           # set to "subdomain" for the getdropbin.xyz wildcard setup
      - key: SITE_DOMAIN
        sync: false           # e.g. getdropbin.xyz; only read when URL_MODE=subdomain
      - key: DASHBOARD_DIST_DIR
        value: /app/web-dist   # matches the Dockerfile's webbuild stage; unused in path mode
      - key: CORS_ORIGINS
        sync: false          # e.g. https://app.getdropbin.xyz,http://localhost:5173
      - key: GITHUB_TOKEN_KEY
        generateValue: true  # Fernet key for GitHub provider tokens
      - key: ADMIN_TOKEN
        generateValue: true  # guards POST /api/admin/gc; blank disables it
      - key: MAX_DEPLOYMENT_BYTES
        value: "52428800"
      - key: MAX_FILES_PER_DEPLOYMENT
        value: "500"
      - key: MAX_USER_BYTES
        value: "104857600"
      - key: MAX_PROXY_BYTES
        value: "5242880"
      - key: SERVE_RATE_LIMIT_PER_MIN
        value: "60"
      - key: UPLOAD_RATE_LIMIT_PER_HOUR
        value: "20"
